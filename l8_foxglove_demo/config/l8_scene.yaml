# The L8 Foxglove demo's node. Every number here is chosen for the demo, except
# those that copy L8 (the horizon, the step, the dots, the 2 m threshold).
l8_scene:
  ros__parameters:
    host: "localhost"
    port: 2000
    tm_port: 8000          # the Traffic Manager the L2 bridge made synchronous

    vehicles: 8            # traffic cars, at the spawn points nearest the AV (chosen)
    seed: 7                # which car models (chosen)
    min_spawn_gap: 10.0    # m: no car spawned closer than this to the AV (chosen)

    rate_hz: 10.0          # one prediction every 0.1 s, as in L8
    horizon: 5.0           # s, L8's horizon
    step: 0.1              # s between predicted points, as in L8
    dot_every: 1.0         # s between the dots on a path, as in L8's figures

    watch_radius: 50.0     # m: cars farther from the AV are not checked (chosen)
    warn_distance: 2.0     # m: half a 4 m lane, L8's miss threshold
    warn_every: 2.0        # s: at most one warning per car this often (chosen)
