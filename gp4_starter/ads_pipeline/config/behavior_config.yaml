behavior_node:
  ros__parameters:
    target_speed: 8.0         # m/s
    slow_speed: 3.0           # m/s in OBSTACLE_AVOIDANCE
    emergency_distance: 8.0   # m
    obstacle_distance: 15.0   # m
    stop_distance: 20.0       # m to a red or yellow light's stop line
    creep_speed: 2.0          # m/s until the first path
    lookahead_s: 2.0          # s of constant-velocity prediction per track
    ped_lookahead_s: 1.0      # s for pedestrian tracks (their speeds are noisy)
    stop_brake: 2.0           # m/s^2, braking to a red or yellow light's line
    stop_margin: 1.0          # m before the line where the car stops
    clearance: 2.0            # m from the path (3.0 stopped for people on the sidewalk)
    # Given LiDAR stop check (behavior_node.py)
    lidar_half_width: 1.1     # m from the path
    front_offset: 2.5         # m from the car's origin to its front
    a_brake: 4.0              # m/s^2 assumed for the stopping distance
    lidar_margin: 2.0         # m added to the stopping distance
    ground_clearance: 0.3     # m above the road
    max_height: 2.5           # m above the road
